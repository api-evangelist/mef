notes:
- Every LSO API declares 400/401/403/500 on every operation; 404/422/501 are declared wherever they apply.
- 501 notImplemented is the standard way a Seller signals an optional operation it does not support.
- Errors are NOT RFC 9457 problem+json — Mplify uses its own TM Forum-derived Error envelope with an enumerated
  code.
