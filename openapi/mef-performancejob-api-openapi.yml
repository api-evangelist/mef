      required:
      - performanceJob
    PerformanceJob_Create:
      type: object
      description: A Performance Monitoring Job specifies the performance monitoring objectives specific to each subject of monitoring which could be  a service, an ordered pair (e.g., two UNIs), or an entity (e.g., port).
      properties:
        buyerJobId:
          type: string
          description: Identifier of the job understood and assigned by the Buyer/Client.
        consumingApplicationId:
          type: string
          description: Identifier of consuming application.
        description:
          type: string
          description: A free-text description of the Performance Job.
        monitoredObject:
          $ref: '#/components/schemas/MonitoredObjectRef'
          description: Defines the reference to object which is a subject of performance monitoring.
        performanceProfile:
          $ref: '#/components/schemas/PerformanceProfileRefOrValue'
          description: Defines the reference to Performance Monitoring Profile or defines values from PerformanceProfile type.
        producingApplicationId:
          type: string
          description: Identifier of producing application.
        scheduleDefinition:
          $ref: '#/components/schemas/ScheduleDefinition'
          description: The schedule definition for running jobs.
      required:
      - monitoredObject
      - performanceProfile
      - scheduleDefinition
    PerformanceProfileValue:
      type: object
      properties:
        granularity:
          $ref: '#/components/schemas/TimeDuration'
          description: Sampling rate of the collection or production of performance indicators.
        jobPriority:
          type: integer
          default: 5
          description: The priority of the Performance Job. The way the management application will use the Job priority to schedule Job execution is application-specific and out the scope.
        jobType:
          $ref: '#/components/schemas/JobType'
          description: The type of PM Job.
        outputFormat:
          $ref: '#/components/schemas/OutputFormat'
          description: List of possible output formats for the Performance Report.
        reportingPeriod:
          $ref: '#/components/schemas/TimeDuration'
          description: Defines the Duration for the report generation.
        resultFormat:
          $ref: '#/components/schemas/ResultFormat'
          description: List of possible result formats that define how Seller/Server will deliver Performance Report to the Buyer/Client.
        serviceSpecificConfiguration:
          $ref: '#/components/schemas/ServiceSpecificConfiguration'
          description: ServiceSpecificConfiguration is used as an extension point for Mplify -specific service performance monitoring configuration.
        '@type':
          description: Used to unambiguously designate the class type when using `oneOf`
          type: string
          enum:
          - PerformanceProfileValue
      required:
      - '@type'
      - granularity
      - jobType
      - outputFormat
      - reportingPeriod
      - resultFormat
      - serviceSpecificConfiguration
      description: The setting of the attributes defined by the PerformanceProfile class when the Performance Job does not have a reference to the Performance Profile.
    ScheduleDefinition:
      type: object
      description: The schedule definition for running jobs.
      properties:
        scheduleDefinitionStartTime:
          type: string
          format: date-time
          description: The start time of the Schedule Definition. If the attribute is empty the Schedule starts immediately after provisioning of the Job.
        scheduleDefinitionEndTime:
          type: string
          format: date-time
          description: The end time of the Schedule Definition. If the attribute is empty the Schedule runs forever, not having a time constraint.
        recurringSchedule:
          $ref: '#/components/schemas/RecurringSchedule'
          description: A recurring frequency to run a job within a timeframe defined  by schedule definition, for example, every 5 minutes, 15 minutes,  1 hour, 1 day. If the attribute is empty, job runs non-stop.
        executionDuration:
          $ref: '#/components/schemas/TimeDuration'
          description: "Total time for running one execution of a schedule. Depending  on the reportingPeriod attribute, one execution of a schedule might produce multiple reports (e.g., when reporting period is 15 minutes\n and executionDuration is 1 hour, every execution of a schedule\nwill produce 4 reports)."
    Error422Code:
      type: string
      description: "One of the following error codes:\n- missingProperty: The property that was expected is not present in the\n  payload\n- invalidValue: The property has an incorrect value\n- invalidFormat: The property value does not comply with the expected \n  value format\n- referenceNotFound: The object referenced by the property cannot be \n  identified in the target system\n- unexpectedProperty: Additional, not expected property has been \n  provided\n- tooLargeDataset: The requested entity will produce too much data\n- tooManyRecords: The number of records to be provided in the response\n  exceeds the threshold\n- tooManyRequests: The number of simultaneous requests from one API \n  client exceeds the threshold\n- performanceProfileInUse: Requested Performance Profile is being used\n  by a Performance Job\n- otherIssue: Other problem was identified (detailed information\n  provided in a reason)."
      enum:
      - missingProperty
      - invalidValue
      - invalidFormat
      - referenceNotFound
      - unexpectedProperty
      - tooLargeDataset
      - tooManyRecords
      - tooManyRequests
      - performanceProfileInUse
      - otherIssue
