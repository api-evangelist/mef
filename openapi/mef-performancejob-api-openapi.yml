      - performanceJob
components:
  schemas:
    PerformanceProfileRefOrValue_Query:
      type: object
      description: Defines the reference to Performance Monitoring Profile or defines values from PerformanceProfile type.
      discriminator:
        mapping:
          PerformanceProfileRef: '#/components/schemas/PerformanceProfileRef'
          PerformanceProfileValue_Query: '#/components/schemas/PerformanceProfileValue_Query'
        propertyName: '@type'
      oneOf:
      - $ref: '#/components/schemas/PerformanceProfileRef'
      - $ref: '#/components/schemas/PerformanceProfileValue_Query'
    OutputFormat:
      type: string
      description: List of possible output formats for the Report.
      enum:
      - json
      - xml
      - avro
      - csv
    RecurringSchedule:
      type: object
      description: "A definition of recurring schedule to run a job based on the Cron utility in Linux-like systems. It defines how the job should periodically run at specified times, dates, or intervals. Special characters can be used in the definition of individual fields, such as:\n  - `*` -> any value\n  - `,` -> value list separator\n  - `-` -> range of values\n  - `/` -> step values"
      properties:
        second:
          type: string
          description: "A definition of time (seconds) to run a job. Allowed values: 0-59, and special characters (*,-/). For example:\n  - */5 * * * * * -> run a job at every 5th second. \n  - */30 */1 * * * * -> run a job at every 30 seconds \n    past every minute."
        minute:
          type: string
          description: "A definition of time (minutes) to run a job. Allowed values: 0-59, and special characters (*,-/). For example:\n  - 0 */10 * * * * -> run a job at every 10th minute. \n  - 0 */30 0 * * * -> run a job at every 30th minute past midnight.\n  - 0 */30 8 * * 1 -> run a job at every 30th minute \n    past hour 8 on Monday."
        hour:
          type: string
          description: "A definition of time (hour) to run a job. Allowed values: 0-23, and special characters (*,-/). For example:\n  - 0 0 10 10 * * -> run a job at 10 am on 10th day of every month.\n  - 0 * 1,2 * * * -> run a job at every minute past hour 1 and 2.\n  - 0 0 */2 * * * -> run a job at every 2nd hour."
        dayOfMonth:
          type: string
          description: "A definition of time (day of month) to run a job. Allowed values: 1-31, and special characters (*,-/). For example:\n  - 0 0 0 1,5,10,15 * * -> run a job at midnight \n    on every 1st, 5th, 10th, 15th day of month. \n  - 0 0 */1 1-10 1-3 * -> run a job at every full hour between 1st \n    and 10th day of month in January, February, and March."
        month:
          type: string
          description: "A definition of time (month) to run a job. Allowed values: 1-12 or JAN-DEC, and special characters (*,-/). For example:\n  - 0 5 0 * 8 * -> run a job at 00:05 on every day in August. \n  - 0 0 0,12 1 */2 * -> run a job at midnight and noon \n    on every 1st day of every 2nd month."
        dayOfWeek:
          type: string
          description: "A definition of time (day of week) to run a job. Allowed values: 0-6 or SUN-SAT, and special characters. For example:\n  - 0 0 22 * * 1-5 -> run a job at 22:00 on every day \n    between Monday and Friday. \n  - 0 5 4 * * sun -> run a job at 04:05 on Sunday."
    TerminationError:
      type: object
      description: This indicates an error that caused a PM Job or PM Report to be terminated. The code and propertyPath should be used like in Error422.
      properties:
        code:
          $ref: '#/components/schemas/Error422Code'
          description: 'One of the following error codes:

            - missingProperty: The property that was expected is not present in the payload

            - invalidValue: The property has an incorrect value

            - invalidFormat: The property value does not comply with the expected value format

            - referenceNotFound: The object referenced by the property cannot be identified in the target system

            - unexpectedProperty: Additional, not expected property has been provided

            - tooLargeDataset: The requested entity will produce too much data

            - tooManyRecords: The number of records to be provided in the response exceeds the threshold

            - tooManyRequests: The number of simultaneous requests from one API client exceeds the threshold

            - performanceProfileInUse: Requested Performance Profile is being used by a Performance Job

            - otherIssue: Other problem was identified (detailed information provided in a reason).

            '
        propertyPath:
          type: string
          description: 'A pointer to a particular property of the payload that caused the validation issue. It is highly recommended that this property should be used.

            Defined using JavaScript Object Notation (JSON) Pointer (https://tools.ietf.org/html/rfc6901).

            '
        value:
          type: string
          description: Text to describe the reason of the termination.
    EntityRef:
      type: object
      description: Reference to Entity.
      properties:
        '@referredType':
          type: string
          description: The type of the referred object. This is used to distinguish between different types of objects that can be referred to by the EntityId.
        entityHref:
          type: string
          description: Hyperlink to the Entity resource. This is used to provide a link to the Entity resource in the Seller/Server system.
        entityId:
          type: string
          description: Identifier of an Entity.
