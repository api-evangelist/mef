openapi: 3.2.0
info:
  title: Mef events subscription API
  version: '1.0'
  description: 'Operations tagged events subscription across 16 of this provider''s published API definitions: mef-lso-allegro-alarm-management-openapi.yml, mef-lso-allegro-fault-management-openapi.yml, mef-lso-allegro-performance-monitoring-openapi.yml, mef-lso-allegro-service-function-test-openapi.yml, mef-lso-allegro-service-inventory-management-openapi.yml, mef-lso-allegro-service-ordering-management-openapi.yml, mef-lso-cantata-appointment-management-openapi.yml…'
servers:
- url: https://{serverBase}/mefApi/allegro/alarmManagement/v3/
  variables:
    serverBase:
      description: The base of SOF's URL.
      default: mplify.net
- url: https://{serverBase}/mefApi/allegro/faultManagement/v3/
  variables:
    serverBase:
      default: mplify.com
      description: The base hostname of the SOF (Service Orchestration Function) server.
- url: https://{serverBase}/mefApi/allegro/performanceMonitoring/v5/
  variables:
    serverBase:
      default: mplify.com
      description: The base hostname of the SOF (Service Orchestration Function) server.
- url: https://{serverBase}/mefApi/allegro/serviceFunctionTesting/v3/
  variables:
    serverBase:
      description: The base of SOF's URL.
      default: mplify.net
- url: https://{serverBase}/mefApi/allegro/serviceInventory/v2/
  variables:
    serverBase:
      description: The base of SOF's URL.
      default: mplify.net
- url: https://{serverBase}/mefApi/allegro/serviceOrderingManagement/v1/
  variables:
    serverBase:
      description: The base of SOF's URL.
      default: mplify.net
- url: https://{serverBase}/mefApi/cantata/appointment/v3/
  variables:
    serverBase:
      description: The base of Seller's URL.
      default: mplify.net
- url: https://{serverBase}/mefApi/cantata/customerBillManagement/v3/
  variables:
    serverBase:
      description: The base of Seller's URL.
      default: mplify.net
- url: https://{serverBase}/mefApi/cantata/cimIncident/v1/
  variables:
    serverBase:
      description: The base of Seller's URL.
      default: mef.net
- url: https://{serverBase}/mefApi/cantata/geographicAddressManagement/v2/
  variables:
    serverBase:
      description: The base of Seller's URL.
      default: mplify.net
- url: http://{serverBase}/mefApi/cantata/productCatalog/v4/
  variables:
    serverBase:
      description: The base of Buyer's URL.
      default: mplify.net
- url: https://{serverBase}/mefApi/cantata/productOfferingQualification/v8/
  variables:
    serverBase:
      description: The base of Seller's URL.
      default: mplify.net
- url: https://{serverBase}/mefApi/cantata/productOrderingManagement/v6/
