      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        properties:
          code:
            description: 'One of the following error codes:

              - missingCredentials: No credentials provided.

              - invalidCredentials: Provided credentials are invalid or

              expired

              '
            $ref: '#/components/schemas/Error401Code'
        required:
        - code
    Error403:
      description: Forbidden. This code indicates that the server understood the request but refuses to authorize it. (https://tools.ietf.org/html/rfc7231#section-6.5.3)
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        properties:
          code:
            description: 'This code indicates that the server understood

              the request but refuses to authorize it because

              of one of the following error codes:

              - accessDenied: Access denied

              - forbiddenRequester: Forbidden requester

              - tooManyUsers: Too many users'
            $ref: '#/components/schemas/Error403Code'
        required:
        - code
    Error404:
      description: Resource for the requested path not found. (https://tools.ietf.org/html/rfc7231#section-6.5.4)
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        properties:
          code:
            description: 'The following error code:

              - notFound: A current representation for the target resource

              not found

              '
            type: string
            enum:
            - notFound
        required:
        - code
    Error401Code:
      description: 'One of the following error codes:

        - missingCredentials: No credentials provided.

        - invalidCredentials: Provided credentials are invalid or expired

        '
      type: string
      enum:
      - missingCredentials
      - invalidCredentials
    EventSubscription:
      required:
      - id
      allOf:
      - $ref: '#/components/schemas/EventSubscriptionInput'
      - description: This resource is used to respond to notification subscriptions.
        type: object
        properties:
          id:
            description: An identifier of this Event Subscription assigned when a resource is created.
            type: string
    Error400:
      description: Bad Request. (https://tools.ietf.org/html/rfc7231#section-6.5.1)
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        properties:
          code:
            description: 'One of the following error codes:

              - missingQueryParameter: The URI is missing a required

              query-string parameter

              - missingQueryValue: The URI is missing a required query-string

              parameter value

              - invalidQuery: The query section of the URI is invalid.

              - invalidBody: The request has an invalid body

              '
            $ref: '#/components/schemas/Error400Code'
        required:
        - code
    Error:
      description: 'Standard Class used to describe API response error Not intended to be used directly. The `code` in the HTTP header is used as a discriminator for the type of error returned in runtime.

        '
      type: object
      properties:
        message:
          description: Text that provides mode details and corrective actions related to the error. This can be shown to a client user.
          type: string
        reason:
          description: Text that explains the reason for the error. This can be shown to a client user.
          type: string
          maxLength: 255
        referenceError:
          description: URL pointing to documentation describing the error
          type: string
          format: uri
      required:
      - reason
    EventSubscriptionInput:
      description: This class is used to register for Notifications.
      type: object
      properties:
        callback:
          description: 'This callback value must be set to *host* property from Alarm Notification API (alarmNotification.api.yaml). This property is appended with the base path and notification resource path specified in that API to construct an URL to which  notification is sent. E.g. for ''callback'':  "https://buyer.mplify.com/listenerEndpoint", the alarm event notification will be  sent to: `https://buyer.mplify.com/listenerEndpoint/mefApi/allegro/alarmNotification/v3/listener/`'
          type: string
        query:
          description: 'This attribute is used to define which type of events to register to. Example: ''query'':''eventType =  createAlarm''. To subscribe for more than one event type, put the values separated by a comma: `eventType=alarmCreateEvent, alarmAttributeValueChangeEvent`. The possible values are enumerated by Event type enums in alarmNotification.api.yaml. An empty query is treated as specifying no filters - ending in subscription for all event types.'
          type: string
      required:
      - callback
    Error403Code:
      description: 'This code indicates that the server understood

        the request but refuses to authorize it because

        of one of the following error codes:

        - accessDenied: Access denied

        - forbiddenRequester: Forbidden requester

