      summary: Lists or finds ModifyProductOrderItemRequestedDeliveryDate objects
      description: This operation lists or finds ModifyProductOrderItemRequestedDeliveryDate entities
      operationId: listModifyProductOrderItemRequestedDeliveryDate
      parameters:
      - name: productOrderId
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
          enum:
          - acknowledged
          - done
          - done.declined
          - inProgress.assessingCharge
          - rejected
      - name: expediteIndicator
        in: query
        description: Indicates that expedited treatment is requested.
        required: false
        schema:
          type: boolean
      - name: requestedCompletionDate.gt
        in: query
        description: Identifies the Buyer's desired due date (requested delivery date) - greater than
        required: false
        schema:
          type: string
          format: date-time
      - name: requestedCompletionDate.lt
        in: query
        description: Identifies the Buyer's desired due date (requested delivery date) - lesser than
        required: false
        schema:
          type: string
          format: date-time
      - name: creationDate.gt
        in: query
        description: The date on which the Seller assigned the Modify Product Order Item Requested Delivery Data Identifier - greater than
        required: false
        schema:
          type: string
          format: date-time
      - name: creationDate.lt
        in: query
        description: The date on which the Seller assigned the Modify Product Order Item Requested Delivery Data Identifier - lesser than
        required: false
        schema:
          type: string
          format: date-time
      - name: buyerId
        in: query
        description: The unique identifier of the organization that is acting as the a Buyer. MUST be specified in the request only when the requester represents more than one Buyer.
        required: false
        schema:
          type: string
      - name: sellerId
        in: query
        description: The unique identifier of the organization that is acting as the Seller. MUST be specified in the request only when responding entity  represents more than one Seller.
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Requested index for start of item to be provided in response requested by client. Note that the index starts with "0".
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: Requested number of items to be provided in response requested by client
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          headers:
            X-Pagination-Throttled:
              description: 'Used to indicate that result page was throttled to maximum possible size  and there are additional results that can be fetched

                '
              schema:
                type: boolean
            X-Total-Count:
              description: 'The total number of matching items. E.g. if there are 50 matching items in total, but the request has offset=10 and limit=10, then the X-Total-Count is 50.

                '
              schema:
                type: integer
            X-Result-Count:
              description: The number of items included in the response
              schema:
                type: integer
          content:
            application/json;charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MEFModifyProductOrderItemRequestedDeliveryDate'
        '400':
          description: Bad Request
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: Forbidden
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error403'
        '500':
          description: Internal Server Error
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error500'
        '501':
          description: Method not implemented.
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error501'
    post:
      tags:
      - modifyProductOrderItemRequestedDeliveryDate
      summary: Creates a ModifyProductOrderItemRequestedDeliveryDate
      description: This operation creates a ModifyProductOrderItemRequestedDeliveryDate entity.
      operationId: createModifyProductOrderItemRequestedDeliveryDate
      parameters:
      - name: buyerId
        in: query
        description: The unique identifier of the organization that is acting as the Buyer. MUST be specified in the request only when the requester represents more than one Buyer.
        required: false
        schema:
          type: string
      - name: sellerId
        in: query
        description: The unique identifier of the organization that is acting as the Seller. MUST be specified in the request only when responding entity  represents more than one Seller.
        required: false
        schema:
          type: string
      requestBody:
        description: The ModifyProductOrderItemRequestedDeliveryDate to be created
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/MEFModifyProductOrderItemRequestedDeliveryDate_Create'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/MEFModifyProductOrderItemRequestedDeliveryDate'
        '400':
          description: Bad Request
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json;charset=utf-8:
              schema:
