          rule-type:
            description: none
            $ref: '#/components/schemas/tapi.topology.RuleType'
        description: none
    tapi.topology.TransferIntegrityPac:
      type: object
      properties:
        error-characteristic:
          type: string
          description: "Describes the degree to which the signal propagated can be errored.\n                    Applies to TDM systems as the errored signal will be propagated and not packet as errored packets will be discarded."
        unavailable-time-characteristic:
          type: string
          description: Describes the duration for which there may be no valid signal propagated.
        server-integrity-process-characteristic:
          type: string
          description: Describes the effect of any server integrity enhancement process on the characteristics of the TopologicalEntity.
        delivery-order-characteristic:
          type: string
          description: "Describes the degree to which packets will be delivered out of sequence.\n                    Does not apply to TDM as the TDM protocols maintain strict order."
        repeat-delivery-characteristic:
          type: string
          description: "Primarily applies to packet systems where a packet may be delivered more than once (in fault recovery for example).\n                    It can also apply to TDM where several frames may be received twice due to switching in a system with a large differential propagation delay."
        loss-characteristic:
          type: string
          description: "Describes the acceptable characteristic of lost packets where loss may result from discard due to errors or overflow.\n                    Applies to packet systems and not TDM (as for TDM errored signals are propagated unless grossly errored and overflow/underflow turns into timing slips)."
    tapi.common.LayerProtocolName:
      type: string
      enum:
      - OTSiA
      - OCH
      - OTU
      - ODU
      - ETH
      - ETY
      - DSR
    tapi.common.LocalClass:
      type: object
      properties:
        name:
          type: array
          description: List of names. A property of an entity with a value that is unique in some namespace but may change during the life of the entity. A name carries no semantics with respect to the purpose of the entity.
          items:
            $ref: '#/components/schemas/tapi.common.NameAndValue'
        local-id:
          type: string
          description: none
