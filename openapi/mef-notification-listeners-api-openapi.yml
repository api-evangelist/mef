components:
  schemas:
    AlarmType:
      description: 'Categorize the alarm. Values as defined in X.733 8.1.1 or 3GPP TS32.111.


        | state                            | Mplify 133.1 name             | Description                                                                                                                                                                                                                                                                                                                                                                                                                                                   |

        | -------------------------------- | -------------------------|------------------------------------------------------------------------------------------------------------------------------------------------|

        | `communicationsAlarm`            | Communications Alarm     | An alarm of this type is principally associated with the procedures and/or processes required to convey information from one point to another. |

        | `processingErrorAlarm`           | Processing Error Alarm   | An alarm of this type is principally associated with a software or processing fault.                                                           |

        | `environmentalAlarm`             | Environmental Alarm      | An alarm of this type is principally associated with a condition relating to an enclosure in which the equipment resides.                      |

        | `qualityOfServiceAlarm`          | Quality of Service Alarm | An alarm of this type is principally associated with a degradation in the quality of a service.                                                |

        | `equipmentAlarm`                 | Equipment Alarm          | An alarm of this type is principally associated with an equipment fault.                                                                       |

        | `communicationsAlarm`            | Communications Alarm     | An alarm of this type is principally associated with the procedures and/or processes required to convey information from one point to another. |

        | `processingErrorAlarm`           | Processing Error Alarm   | An alarm of this type is principally associated with a software or processing fault.                                                           |

        | `environmentalAlarm`             | Environmental Alarm      | An alarm of this type is principally associated with a condition relating to an enclosure in which the equipment resides.                      |

        | `qualityOfServiceAlarm`          | Quality of Service Alarm | An alarm of this type is principally associated with a degradation in the quality of a service.                                                |

        | `equipmentAlarm`                 | Equipment Alarm          | An alarm of this type is principally associated with an equipment fault.                                                                       |

        | `integrityViolation`             | Integrity Violation      | Information may have been illegally modified, inserted or deleted.                                                                             |

        | `operationalViolation`           | Operational Violation    | The unavailability, malfunction or incorrect invocation of a service.                                                                          |

        | `physicalViolation`              | Physical Violation       | A physical resource has been violated in a way that suggests a security attack.                                                                |

        | `securityService`                | Security Service         | A security attack has been detected by a security service.                                                                                     |

        | `mechanismViolation`             | Mechanism Violation      | A security attack has been detected by a security mechanism.                                                                                   |

        | `timeDomainViolation`            | Time Domain Violation    | An event has occurred at an unexpected or prohibited time.                                                                                     |'
      type: string
      enum:
      - communicationsAlarm
      - processingErrorAlarm
      - environmentalAlarm
      - qualityOfServiceAlarm
      - equipmentAlarm
      - integrityViolation
      - operationalViolation
      - physicalViolation
      - securityService
      - mechanismViolation
      - timeDomainViolation
    AlarmEvent:
      allOf:
      - $ref: '#/components/schemas/Event'
      - type: object
        properties:
          eventType:
            description: 'Indicates the type of the event.

              '
            type: string
            enum:
            - alarmAttributeValueChangeEvent
          event:
            description: 'A reference to the object that is source of the notification.

              '
            $ref: '#/components/schemas/AlarmEventPayload'
        required:
        - event
        - eventType
    Error403Code:
      description: 'This code indicates that the server understood

        the request but refuses to authorize it because

        of one of the following error codes:

        - accessDenied: Access denied

        - forbiddenRequester: Forbidden requester

        - tooManyUsers: Too many users'
      type: string
      enum:
      - accessDenied
      - forbiddenRequester
      - tooManyUsers
    ServiceRef:
      description: Reference to a Service instance.
      type: object
      properties:
        href:
          description: Hyperlink reference to Service
          type: string
        id:
          description: unique identifier of Service
          type: string
      required:
      - id
    Alarm_Common:
      description: A definition of an Alarm.
      type: object
      properties:
        id:
          description: The identifier of the Alarm.
          type: string
        href:
          description: Hyperlink reference
          type: string
          format: uri
        affectedService:
          description: Affected services
          type: array
          items:
            $ref: '#/components/schemas/ServiceRef'
        alarmChangedTime:
          description: Indicates the last date and time when the alarm is changed on the alarm  owning system. Any change to the alarm whether coming from the alarmed  resource is changing this time.
          type: string
          format: date-time
        alarmClearedTime:
          description: Indicates the time (as a date + time) at which the alarm is cleared at  the source.
          type: string
          format: date-time
        alarmDetails:
          description: Contains further information on the Alarm.
          type: string
        alarmedObjectType:
          description: The type (class) of the Managed Object associated with the event e.g. port.
          type: string
        alarmRaisedTime:
          description: The time that an alarm was raised.  This time may differ from the Alarm  Reported Time
          type: string
          format: date-time
        alarmReportingTime:
          description: Indicates the time (as a date + time) at which the alarm was reported by  the owning OSS. It might be different from the alarm-RaisedTime. For instance,  if the alarm list is maintained by an EMS, the alarmRaisedTime would be  the time the alarm was detected by the NE, while the alarmReportingTime  would be the time this alarm was stored in the alarm list of the EMS.
          type: string
          format: date-time
        correlatedAlarm:
          description: Correlated Alarms
          type: array
          items:
            $ref: '#/components/schemas/AlarmRef'
        alarmType:
          $ref: '#/components/schemas/AlarmType'
        perceivedSeverity:
          $ref: '#/components/schemas/PerceivedSeverity'
        plannedOutageIndicator:
          $ref: '#/components/schemas/PlannedOutageIndicator'
        reportingSystemId:
          description: Reporting system identity.
          type: string
        serviceAffecting:
          description: Indicates whether the alarm affects service or not.
          type: boolean
        state:
          $ref: '#/components/schemas/AlarmState'
      required:
      - alarmDetails
      - alarmRaisedTime
      - alarmReportingTime
      - alarmType
      - id
      - perceivedSeverity
      - state
      - serviceAffecting
    Alarm:
      allOf:
      - $ref: '#/components/schemas/Alarm_Common'
      - description: A definition of an Alarm.
        type: object
        properties:
          alarmedObject:
            description: Identifies the Managed Object instance associated with the alarm.
            type: array
            items:
              $ref: '#/components/schemas/AlarmedObjectRef'
          comment:
            type: array
            items:
              $ref: '#/components/schemas/Comment'
          externalAlarmId:
            description: An identifier of the alarm in the source system.
            type: string
          isRootCause:
            description: Indicates whether the alarm is a root cause alarm.
            type: boolean
          parentAlarm:
            $ref: '#/components/schemas/AlarmRef'
          probableCause:
            $ref: '#/components/schemas/ProbableCause'
          alarmSpecificAttributes:
            $ref: '#/components/schemas/AlarmSpecificAttributes'
          sourceSystemId:
            description: Source system identity.
            type: string
          specificProblem:
            description: Provides more specific information about the alarm.
            type: string
        required:
        - isRootCause
    Event:
      description: Event class is used to describe information structure used for notification.
      type: object
      properties:
        eventId:
          description: Id of the event
          type: string
        eventTime:
          description: Date-time when the event occurred
          type: string
          format: date-time
        eventType:
          description: The type of the notification.
          type: string
        event:
          description: The event linked to the involved resource object
          type: object
      required:
      - event
      - eventId
      - eventTime
      - eventType
    Error401Code:
      description: 'One of the following error codes:

        - missingCredentials: No credentials provided.

        - invalidCredentials: Provided credentials are invalid or expired

        '
      type: string
      enum:
      - missingCredentials
      - invalidCredentials
    Error400:
      description: Bad Request. (https://tools.ietf.org/html/rfc7231#section-6.5.1)
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        properties:
          code:
            description: 'One of the following error codes:

              - missingQueryParameter: The URI is missing a required

              query-string parameter

              - missingQueryValue: The URI is missing a required query-string

              parameter value

              - invalidQuery: The query section of the URI is invalid.

              - invalidBody: The request has an invalid body

              '
            $ref: '#/components/schemas/Error400Code'
        required:
        - code
    PlannedOutageIndicator:
      description: Indicates that the Managed Object (related to this alarm) is in in planned maintenance, or out of service.
      type: string
      enum:
      - inPlannedMaintenance
      - outOfService
    Error500:
      description: Internal Server Error. (https://tools.ietf.org/html/rfc7231#section-6.6.1)
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        properties:
          code:
            description: 'The following error code:

              - internalError: Internal server error - the server encountered

              an unexpected condition that prevented it from fulfilling the

              request.

              '
            type: string
            enum:
            - internalError
        required:
        - code
    AlarmSpecificAttributes:
      description: AlarmSpecificAttributes is used as an extension for Alarm specific payload.  The @type attribute is used as a discriminator.
      type: object
      properties:
        '@type':
          description: The named type must be a subclass of AlarmSpecificAttributes.
          type: string
      required:
      - '@type'
      discriminator:
        propertyName: '@type'
    AlarmState:
      description: 'Defines the alarm state during its life cycle.


        | state            | Mplify 133.1 name    |        Description                                                                                                                               |

        | ---------------- | --------------- | ------------------------------------------------------------------------------------------------------------------------------------------------ |

        | `acknowledged`   | Acknowledged    | An alarm that is still active but has been acknowledged by an operator, meaning the operator is aware of the issue and has taken note for action.|

        | `cleared`        | Cleared         | Indicates that the underlying fault or abnormal condition that triggered the alarm has been resolved, and the alarm is no longer active.         |

        | `unAcknowledged` | Unacknowledged  | An alarm that has been raised and is still visible to the operator, but has not yet been acknowledged.                                           |'
      type: string
      enum:
      - acknowledged
      - cleared
      - unAcknowledged
    AlarmRef:
      type: object
      properties:
        id:
          description: unique identifier of the Alarm
          type: string
        href:
          description: hyperlink to the referenced Alarm
          type: string
      required:
      - id
    Error400Code:
      description: 'One of the following error codes:

        - missingQueryParameter: The URI is missing a required query-string

        parameter

        - missingQueryValue: The URI is missing a required query-string

        parameter value

        - invalidQuery: The query section of the URI is invalid.

        - invalidBody: The request has an invalid body

        '
      type: string
      enum:
      - missingQueryParameter
      - missingQueryValue
      - invalidQuery
      - invalidBody
    ProbableCause:
      description: list of alarm probable cause as defined in ITU - T Recommendation X.733 or 3GPP TS 32.111 - 2 Annex B.
      type: string
      enum:
      - adapterError
      - applicationSubsystemFailure
      - bandwidthReduced
      - callEstablishmentError
      - communicationsProtocolError
      - communicationsSubsystemFailure
      - configurationOrCustomizationError
      - congestion
      - corruptData
      - cpuCyclesLimitExceeded
      - datasetOrModemError
      - degradedSignal
      - dteDceInterfaceError
      - enclosureDoorOpen
      - equipmentMalfunction
      - excessiveVibration
      - fileError
      - fireDetected
      - floodDetected
      - framingError
      - heatingVentilationCoolingSystemProblem
      - humidityUnacceptable
      - ioDeviceError
      - inputDeviceError
      - lanError
      - leakDetected
      - localNodeTransmissionError
      - lossOfFrame
      - lossOfSignal
      - materialSupplyExhausted
      - multiplexerProblem
      - outOfMemory
      - outputDeviceError
      - performanceDegraded
      - powerProblem
      - pressureUnacceptable
      - processorProblem
      - pumpFailure
      - queueSizeExceeded
      - receiveFailure
      - receiverFailure
      - remoteNodeTransmissionError
      - resourceNearingCapacity
      - responseTimeExcessive
      - retransmissionRateExcessive
      - softwareError
      - softwareProgramTerminated
      - softwareProgramError
      - storageCapacityProblem
      - temperatureUnacceptable
      - thresholdCrossed
      - timingProblem
      - toxicLeakDetected
      - transmitFailure
      - transmitterFailure
      - underlyingResourceUnavailable
      - versionMismatch
    AlarmEventPayload:
      description: The identifier of the Test Job being subject of this event.
      type: object
      properties:
        alarm:
          $ref: '#/components/schemas/Alarm'
      required:
      - alarm
    PerceivedSeverity:
      description: "List of possible severities that can be allocated to an Alarm. \nThe values are consistent with ITU - T Recommendation X.733. \nOnce an alarm has been cleared, its perceived severity is set to \n'cleared' and can no longer be set\n\n\n| state           | Mplify 133.1 name    | Description                                                                                                                                                                                                                                                                                                                                                                                                                                                                               |\n| --------------- | --------------- | ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| `cleared`       | Cleared         |  The Cleared severity level indicates the clearing of one or more previously reported alarms. |\n| `critical`      | Critical        |  The Critical severity level indicates that a service affecting condition has occurred and an immediate corrective action is required|\n| `indeterminate` | Indeterminate   |  The Indeterminate severity level indicates that the severity level cannot be determined. |\n| `major`         | Major           |  The Major severity level indicates that a service affecting condition has developed and an urgent corrective action is required|\n| `minor`         | Minor           |  The Minor severity level indicates the existence of a non-service affecting fault condition and that corrective action should be taken in order to prevent a more serious (for example, service affecting) fault|\n| `warning`       | Warning         |  The Warning severity level indicates the detection of a potential or impending service affecting fault, before any significant effects have been felt|"
      type: string
      enum:
      - cleared
      - critical
      - indeterminate
      - major
      - minor
