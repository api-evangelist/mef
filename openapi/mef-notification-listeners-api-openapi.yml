    CimIncident:
      description: 'An CIM Incident is a record of an issue that is not part of normal operation in the Seller''s network that has a possible negative impact on the operability of the network on one or more Buyers.

        '
      type: object
      properties:
        '@type':
          description: Used to unambiguously designate the class type when sublassing
          type: string
        attachment:
          description: Attachments to the Incident, such as a file or screenshot. Attachments may be added but may not be modified or deleted (for historical reasons).
          type: array
          items:
            $ref: '#/components/schemas/AttachmentValue'
        closedDate:
          description: The date the CIM Incident status was set to closed by the Seller
          type: string
          format: date-time
        creationDate:
          description: The date on which the CIM Incident was created
          type: string
          format: date-time
        description:
          description: Description of the CIM Incident
          type: string
        expectedClosedDate:
          description: The date provided by the Seller to indicate when the CIM Incident is expected to be closed.
          type: string
          format: date-time
        href:
          description: Hyperlink, a reference to the CIM Incident entity
          type: string
        id:
          description: Unique (within the Seller domain) identifier for the CIM Incident.
          type: string
        impact:
          description: The presumed impact on the Buyer for the referenced Product(s).
          type: string
        incidentType:
          description: The presumed cause of the CIM Incident as evaluated by the Seller.
          type: string
        note:
          description: A set of unstructured comments or information associated to the CIM Incident. Notes may be added but may not be modified or deleted (for historical reasons).
          type: array
          items:
            $ref: '#/components/schemas/Note'
        priority:
          description: The priority (ITIL) is based on the assessment of the impact and urgency of how quickly the CIM Incident should be resolved after evaluation by the Seller of the impact of the CIM Incident.
          $ref: '#/components/schemas/CimIncidentPriorityType'
        relatedContactInformation:
          description: 'Party playing a role in this CIM Incident.

            The ''role'' is to specify the type of contact as specified in MEF 113:

            Incident Contact (''role=incidentContact'') - REQUIRED to be set by the Seller

            Incident Technical Contact (''role=incidentTechnicalContact'')'
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RelatedContactInformation'
        relatedEntity:
          description: A set of identifiers of the Products on which the CIM Incident could have an impact on the normal operation.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RelatedEntity'
        relatedIssue:
          description: A list of Related Issue relationships. Represents relationships to other Trouble Tickets, Incidents, and CIM Incidents.
          type: array
          items:
            $ref: '#/components/schemas/IssueRelationship'
        severity:
          description: The severity (ITIL) of the CIM Incident as evaluated by the Seller.
          $ref: '#/components/schemas/CimIncidentSeverityType'
        situationStartDate:
          description: The date when the situation was first identified, for example via error logs.
          type: string
          format: date-time
        status:
          description: The current status of the CIM Incident
          $ref: '#/components/schemas/IncidentStatusType'
        statusChange:
          description: The status change history that is associated to the CIM Incident. Populated by the Seller.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/IncidentStatusChange'
      required:
      - '@type'
      - creationDate
      - description
      - id
      - impact
      - incidentType
      - priority
      - relatedContactInformation
      - relatedEntity
      - severity
      - situationStartDate
      - status
      - statusChange
      discriminator:
        propertyName: '@type'
        mapping:
          CimFailureIncident: '#/components/schemas/CimFailureIncident'
          CimServiceImpairmentIncident: '#/components/schemas/CimServiceImpairmentIncident'
          CimMaintenanceIncident: '#/components/schemas/CimMaintenanceIncident'
      oneOf:
      - $ref: '#/components/schemas/CimFailureIncident'
      - $ref: '#/components/schemas/CimServiceImpairmentIncident'
      - $ref: '#/components/schemas/CimMaintenanceIncident'
    Note:
      description: Extra information about a given entity. Only useful in processes involving human interaction. Not applicable for an automated process.
      type: object
      properties:
        author:
          description: Author of the note
          type: string
        date:
          description: Date of the note
          type: string
          format: date-time
        id:
          description: Identifier of the note within its containing entity (may or may not be globally unique, depending on provider implementation)
