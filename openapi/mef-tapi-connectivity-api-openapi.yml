    nrp.interface.NrpCarrierEthConnectivityEndPointResource:
      type: object
      properties:
        egress-map-list:
          type: array
          description: "This attribute represents the relationship between the End Point and the Egress Map(s).  This attribute is a set of mappings that determine the content of the S-Tag or C-Tag of an egress EI Frame.\n                        "
          items:
            $ref: '#/components/schemas/mef.common.EgressMap'
        l2cp-address-set:
          description: This attribute specifies the subset of the Bridge Reserved Addresses that are filtered (i.e. L2CP Frames with this destination address are Peered or Discarded but not Passed) at a L2CP Decision Point.
          $ref: '#/components/schemas/mef.common.types.L2cpAddressSet'
        egress-bwp-flow:
          description: This attribute denotes the relationship between a Connectivity Service End Point and the bandwidth profile flow. It describes egress policing on all egress EI Frames mapped to a given End Point.
          $ref: '#/components/schemas/mef.common.BwpFlow'
        eec-mapping-type:
          description: "The Egress Equivalence Class (EEC) is used to specify Egress Bandwidth Profiles. The EEC Mapping Type is one of SEP (Service End Point) based, PCP based or DSCP based.\n                        When the list of EEC Identifier is empty,  this attribute shall be unset. Otherwise it shall be set."
          $ref: '#/components/schemas/mef.common.types.CosOrEecMappingType'
        ce-vlan-id-list-and-untag:
          description: "List of one or more C-VLAN ID values. A C-Tagged Frame, whose C-VLAN ID value matches an entry in this attribute, maps to the Connectivity Service End Point.\n                        It is possible to specify whether untagged and priority tagged frames are included in the mapping.\n                        Type=LIST: all listed VLAN IDs. Type=EXCEPT: all VLAN IDs except the listed ones. Type=ALL, all VLAN IDs, hence vlanId list is not applicable."
          $ref: '#/components/schemas/nrm.connectivity.VlanIdListAndUntag'
        leaf-svlan-id:
          description: This attribute applies only to End Points with Trunk End Point Role. It identifies the S-VLAN ID of frames mapped to either a Leaf End Point or a Trunk End Point (via the Leaf S-VLAN ID value) of the Connectivity Service.
          $ref: '#/components/schemas/mef.common.types.VlanId'
        root-svlan-id:
          description: This attribute applies only to End Points with Trunk End Point Role. It identifies the S-VLAN ID of frames mapped to either a Root End Point or a Trunk End Point (via the Root S-VLAN ID value) of the Connectivity Service.
          $ref: '#/components/schemas/mef.common.types.VlanId'
        cos-mapping-type:
          description: The Class of Service (CoS) is used to specify ingress Bandwidth Profiles. The CoS Mapping Type is one of SEP (Service End Point) based, PCP based or DSCP based.
          $ref: '#/components/schemas/mef.common.types.CosOrEecMappingType'
        ingress-bwp-flow:
          description: ' This attribute denotes the relationship between a Connectivity Service End Point and the bandwidth profile flow. It describes ingress policing on all ingress EI Frames mapped to a given End Point.'
          $ref: '#/components/schemas/mef.common.BwpFlow'
        source-mac-address-limit:
          description: "This attribute limits the number of source MAC Addresses that can be used in ingress EI Frames mapped to the Connectivity Service End Point of all types over a time interval. When not present, the number of source MAC addresses is unlimited.\n                        Two independent parameters control the behavior of this attribute: N : A positive integer and t : A time interval.\n                        This attribute operates by maintaining a list of maximum length N of source MAC addresses which are aged-out of the list if not seen in a time interval t. If an ingress Service Frame arrives with a new source MAC address when the list is full, the Service Frame is discarded."
          $ref: '#/components/schemas/mef.common.types.SourceMacAddressLimit'
        eec-identifier-list:
          type: array
          description: This attribute represents the relationship between the Connectivity Service End Point and the Egress Equivalence Class Identifier(s).
          items:
            $ref: '#/components/schemas/mef.common.EecIdentifier'
        cos-identifier-list:
          type: array
          description: This attribute represents the relationship between the Connectivity Service End Point and the Class of Service Identifier(s).
          items:
            $ref: '#/components/schemas/mef.common.CosIdentifier'
        s-vlan-id-list:
          description: "List of one or more S-VLAN ID values. An S-Tagged Frame, whose S-VLAN ID value matches an entry in this attribute, maps to the Connectivity Service End Point.\n                        Type=LIST: all listed VLAN IDs. Type=EXCEPT: all VLAN IDs except the listed ones. Type=ALL, all VLAN IDs, hence vlanId list is not applicable.\n                        "
          $ref: '#/components/schemas/mef.common.types.VlanIdListing'
        color-identifier:
          description: This attribute represents the relationship between the Connectivity Service End Point and a Color Identifier.
          $ref: '#/components/schemas/mef.common.ColorIdentifier'
    tapi.common.LifecycleState:
      type: string
      enum:
      - PLANNED
      - POTENTIAL_AVAILABLE
      - POTENTIAL_BUSY
      - INSTALLED
      - PENDING_REMOVAL
    mef.common.types.DeiOrDiscard:
      type: string
