    nrp.interface.NrpCarrierEthConnectivityResource:
      type: object
      properties:
        ce-vlan-id-preservation:
          description: "This attribute describes a relationship between the format of the VLAN ID and related fields values of the frame at one Interface and the format and VLAN ID and related fields values of the corresponding frame at another Interface.\n                        Used the MEF 7.3 OVC type (PRESERVE/STRIP/RETAIN) as it depends on EVC/OVC decomposition performed by SOFs.\n                        "
          $ref: '#/components/schemas/mef.common.types.VlanIdPreservation'
        ce-vlan-pcp-preservation:
          type: boolean
          description: This attribute can be used to preserve the value of the CE-VLAN PCP field in VLAN Tagged Service Frames across a Connectivity Service.
          default: false
        s-vlan-dei-preservation:
          type: boolean
          description: This attribute describes a relationship between the S-VLAN DEI value of a frame at one ENNI and the S-VLAN DEI of the corresponding frame at another ENNI supported by the Operator CEN where each ENNI has a Connectivity Service End Point that is associated by the Connectivity Service.
          default: false
        max-frame-size:
          type: integer
          format: int64
          description: This attribute denotes the maximum frame size in bytes requested for the connectivity service.
        multipoint-capable:
          type: boolean
          description: A value of “true” indicates that the End Points can be added/removed during Connectivity Service lifecycle.
          default: false
        broadcast-frame-delivery:
          description: When the value is conditionally, the conditions that determine whether a Data Service Frame is delivered or discarded MUST be specified. Conditions can be described in the name-value pair list.
          $ref: '#/components/schemas/nrm.connectivity.FrameDeliveryCondition'
        s-vlan-pcp-preservation:
          type: boolean
          description: This attribute describes a relationship between the S-VLAN PCP value of a frame at one ENNI and the S-VLAN PCP of the corresponding frame at another ENNI supported by the Operator CEN where each ENNI has a Connectivity Service End Point that is associated by the Connectivity Service.
          default: false
        ce-vlan-dei-preservation:
          type: boolean
          description: This attribute can be used to preserve the value of the CE-VLAN DEI field in VLAN Tagged Service Frames across a Connectivity Service.
          default: false
        multicast-frame-delivery:
          description: When the value is conditionally, the conditions that determine whether a Data Service Frame is delivered or discarded MUST be specified. Conditions can be described in the name-value pair list.
          $ref: '#/components/schemas/nrm.connectivity.FrameDeliveryCondition'
        unicast-frame-delivery:
          description: When the value is conditionally, the conditions that determine whether a Data Service Frame is delivered or discarded MUST be specified. Conditions can be described in the name-value pair list.
          $ref: '#/components/schemas/nrm.connectivity.FrameDeliveryCondition'
    tapi.connectivity.Switch:
      allOf:
      - $ref: '#/components/schemas/tapi.common.LocalClass'
      - type: object
        properties:
          selected-connection-end-point:
            type: array
            description: none
            items:
              $ref: '#/components/schemas/tapi.connectivity.ConnectionEndPointRef'
          selected-route:
            type: array
            description: none
            items:
              type: string
              x-path: /tapi-common:context/tapi-connectivity:connection/tapi-connectivity:route/tapi-connectivity:local-id
          selection-control:
            description: Degree of administrative control applied to the switch selection.
            $ref: '#/components/schemas/tapi.connectivity.SelectionControl'
          selection-reason:
            description: The reason for the current switch selection.
            $ref: '#/components/schemas/tapi.connectivity.SelectionReason'
          switch-direction:
            description: Indicates whether the switch selects from ingress to the FC or to egress of the FC, or both.
            $ref: '#/components/schemas/tapi.common.PortDirection'
        description: "The class models the switched forwarding of traffic (traffic flow) between FcPorts (ConnectionEndPoints) and is present where there is protection functionality in the FC (Connection).\n                If an FC exposes protection (having two or more FcPorts that provide alternative identical inputs/outputs), the FC will have one or more associated FcSwitch objects to represent the alternative flow choices visible at the edge of the FC.\n                The FC switch represents and defines a protection switch structure encapsulated in the FC.\n                Essentially performs one of the functions of the Protection Group in a traditional model. It associates to 2 or more FcPorts each playing the role of a Protection Unit.\n                One or more protection, i.e. standby/backup, FcPorts provide protection for one or more working (i.e. regular/main/preferred) FcPorts where either protection or working can feed one or more protected FcPort.\n                The switch may be used in revertive or non-revertive (symmetric) mode. When in revertive mode it may define a waitToRestore time.\n                It may be used in one of several modes including source switch, destination switched, source and destination switched etc (covering cases such as 1+1 and 1:1).\n                It may be locked out (prevented from switching), force switched or manual switched.\n                It will indicate switch state and change of state.\n                The switch can be switched away from all sources such that it becomes open and hence two coordinated switches can both feed the same LTP so long as at least one of the two is switched away from all sources (is 'open').\n                The ability for a Switch to be 'high impedance' allows bidirectional ForwardingConstructs to be overlaid on the same bidirectional LTP where the appropriate control is enabled to prevent signal conflict.\n                This ability allows multiple alternate routes to be present that otherwise would be in conflict."
    mef.common.Envelope:
      type: object
      properties:
        coupling-flag-for-index-zero:
          type: boolean
          description: This attribute denotes the coupling flag for index zero. FALSE for NO and TRUE for YES (overflow Green tokens can be used as Yellow tokens)
          default: false
        envelope-id:
          type: string
          description: This attribute is a string that identifies the Envelope.
    mef.common.types.SourceMacAddressLimit:
      type: object
      properties:
        limit:
          type: integer
          format: int64
          description: This attribute denotes the maximum acceptable source MAC addresses.
        time-interval:
          type: integer
          format: int64
          description: This attribute denotes the time interval in milliseconds.
    tapi.common.AdministrativeState:
      type: string
