openapi: 3.2.0
info:
  description: MEF 60 (PRESTO NRP) swagger definition
  version: 2018R2
  title: Network Resource Provisioning Tapi Connectivity API
servers:
- url: https://localhost:1234/restconf
tags:
- name: tapi-connectivity
paths:
  /operations/create-connectivity-service/:
    post:
      tags:
      - tapi-connectivity
      responses:
        200:
          description: Correct response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tapi.connectivity.CreateConnectivityServiceOutput'
            application/xml:
              schema:
                $ref: '#/components/schemas/tapi.connectivity.CreateConnectivityServiceOutput'
        201:
          description: No response
        400:
          description: Internal error
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tapi.connectivity.CreateConnectivityServiceInput'
          application/xml:
            schema:
              $ref: '#/components/schemas/tapi.connectivity.CreateConnectivityServiceInput'
      summary: Create operations create connectivity service
      x-summary-source: derived
      operationId: postOperationsCreateConnectivityService
      x-operation-id-source: derived
  /operations/delete-connectivity-service/:
    post:
      tags:
      - tapi-connectivity
      responses:
        200:
          description: Correct response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tapi.connectivity.DeleteConnectivityServiceOutput'
            application/xml:
              schema:
                $ref: '#/components/schemas/tapi.connectivity.DeleteConnectivityServiceOutput'
        201:
          description: No response
        400:
          description: Internal error
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tapi.connectivity.DeleteConnectivityServiceInput'
          application/xml:
            schema:
              $ref: '#/components/schemas/tapi.connectivity.DeleteConnectivityServiceInput'
      summary: Create operations delete connectivity service
      x-summary-source: derived
      operationId: postOperationsDeleteConnectivityService
      x-operation-id-source: derived
  /operations/get-connection-details/:
    post:
      tags:
      - tapi-connectivity
      responses:
        200:
          description: Correct response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tapi.connectivity.GetConnectionDetailsOutput'
            application/xml:
              schema:
                $ref: '#/components/schemas/tapi.connectivity.GetConnectionDetailsOutput'
        201:
          description: No response
        400:
          description: Internal error
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tapi.connectivity.GetConnectionDetailsInput'
          application/xml:
            schema:
              $ref: '#/components/schemas/tapi.connectivity.GetConnectionDetailsInput'
      summary: Create operations get connection details
      x-summary-source: derived
      operationId: postOperationsGetConnectionDetails
      x-operation-id-source: derived
  /operations/get-connectivity-service-details/:
    post:
      tags:
      - tapi-connectivity
      responses:
        200:
          description: Correct response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tapi.connectivity.GetConnectivityServiceDetailsOutput'
            application/xml:
              schema:
                $ref: '#/components/schemas/tapi.connectivity.GetConnectivityServiceDetailsOutput'
        201:
          description: No response
        400:
          description: Internal error
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tapi.connectivity.GetConnectivityServiceDetailsInput'
          application/xml:
            schema:
              $ref: '#/components/schemas/tapi.connectivity.GetConnectivityServiceDetailsInput'
      summary: Create operations get connectivity service details
      x-summary-source: derived
      operationId: postOperationsGetConnectivityServiceDetails
      x-operation-id-source: derived
  /operations/get-connectivity-service-list/:
    post:
      tags:
      - tapi-connectivity
      responses:
        200:
          description: Correct response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tapi.connectivity.GetConnectivityServiceListOutput'
            application/xml:
              schema:
                $ref: '#/components/schemas/tapi.connectivity.GetConnectivityServiceListOutput'
        201:
          description: No response
        400:
          description: Internal error
      summary: Create operations get connectivity service list
      x-summary-source: derived
      operationId: postOperationsGetConnectivityServiceList
      x-operation-id-source: derived
  /operations/update-connectivity-service/:
    post:
      tags:
      - tapi-connectivity
      responses:
        200:
          description: Correct response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tapi.connectivity.UpdateConnectivityServiceOutput'
            application/xml:
              schema:
                $ref: '#/components/schemas/tapi.connectivity.UpdateConnectivityServiceOutput'
        201:
          description: No response
        400:
          description: Internal error
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tapi.connectivity.UpdateConnectivityServiceInput'
          application/xml:
            schema:
              $ref: '#/components/schemas/tapi.connectivity.UpdateConnectivityServiceInput'
      summary: Create operations update connectivity service
      x-summary-source: derived
      operationId: postOperationsUpdateConnectivityService
      x-operation-id-source: derived
components:
  schemas:
    tapi.common.OperationalState:
      type: string
      enum:
      - DISABLED
      - ENABLED
    mef.common.types.L2cpProtocol:
      type: object
      properties:
        sub-type:
          type: integer
          format: int64
          description: This attribute specifies the subtype of the L2CP protocol.
        llc-address-or-ether-type:
          type: integer
          format: int64
          description: This attribute specifies the LLC address or the EtherType value.
        l2cp-protocol-type:
          description: This attribute specifies the type of L2CP protocol, i.e., LLC or EtherType.
          $ref: '#/components/schemas/mef.common.types.L2cpProtocolType'
    mef.common.types.PcpOrDiscard:
      type: string
      enum:
      - DISCARD
      - '0'
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      - '6'
      - '7'
    tapi.connectivity.ConnectionRef:
      type: object
      properties:
        connection-id:
          type: string
          x-path: /tapi-common:context/tapi-connectivity:connection/tapi-connectivity:uuid
    tapi.connectivity.RouteComputePolicy:
      type: object
      properties:
        diversity-policy:
          description: none
          $ref: '#/components/schemas/tapi.connectivity.DiversityPolicy'
        route-objective-function:
          description: none
          $ref: '#/components/schemas/tapi.connectivity.RouteObjectiveFunction'
    nrp.interface.CreateConnectivityServiceInputAugmentation1:
      type: object
      properties:
        nrp-carrier-eth-connectivity-resource:
          description: none
          $ref: '#/components/schemas/nrp.interface.NrpCarrierEthConnectivityResource'
      x-augmentation:
        prefix: nrp-interface
        namespace: urn:mef:yang:nrp-interface
    tapi.connectivity.getconnectivityservicelist.output.Service:
      allOf:
      - $ref: '#/components/schemas/nrp.interface.ServiceAugmentation1'
      - $ref: '#/components/schemas/tapi.common.AdminStatePac'
      - $ref: '#/components/schemas/tapi.common.GlobalClass'
      - $ref: '#/components/schemas/tapi.connectivity.ConnectivityConstraint'
      - $ref: '#/components/schemas/tapi.connectivity.ResilienceConstraint'
      - $ref: '#/components/schemas/tapi.connectivity.TopologyConstraint'
      - type: object
        properties:
          layer-protocol-name:
            description: none
            $ref: '#/components/schemas/tapi.common.LayerProtocolName'
          connection:
            type: array
            description: none
            items:
              type: string
              x-path: /tapi-common:context/tapi-connectivity:connection/tapi-connectivity:uuid
          end-point:
            type: array
            description: none
            items:
              $ref: '#/components/schemas/tapi.connectivity.getconnectivityservicelist.output.service.EndPoint'
          direction:
            description: none
            $ref: '#/components/schemas/tapi.common.ForwardingDirection'
        description: none
    tapi.topology.NodeRef:
      allOf:
      - $ref: '#/components/schemas/tapi.topology.TopologyRef'
      - type: object
        properties:
          node-id:
            type: string
            x-path: /tapi-common:context/tapi-topology:topology/tapi-topology:node/tapi-topology:uuid
    nrp.interface.EndPointAugmentation1:
      type: object
      properties:
        nrp-carrier-eth-connectivity-end-point-resource:
          description: none
          $ref: '#/components/schemas/nrp.interface.NrpCarrierEthConnectivityEndPointResource'
      x-augmentation:
        prefix: nrp-interface
        namespace: urn:mef:yang:nrp-interface
    tapi.common.PortDirection:
      type: string
      enum:
      - BIDIRECTIONAL
      - INPUT
      - OUTPUT
      - UNIDENTIFIED_OR_UNKNOWN
    tapi.connectivity.UpdateConnectivityServiceInputInput:
      allOf:
      - $ref: '#/components/schemas/nrp.interface.UpdateConnectivityServiceInputAugmentation1'
      - type: object
        properties:
          service-id-or-name:
            type: string
            description: none
          end-point:
            description: none
            $ref: '#/components/schemas/tapi.connectivity.updateconnectivityservice.input.EndPoint'
          resilience-constraint:
            type: array
            description: none
            items:
              $ref: '#/components/schemas/tapi.connectivity.ResilienceConstraint'
          topo-constraint:
            description: none
            $ref: '#/components/schemas/tapi.connectivity.TopologyConstraint'
          state:
            type: string
            description: none
          conn-constraint:
            description: none
            $ref: '#/components/schemas/tapi.connectivity.ConnectivityConstraint'
        description: ''
    tapi.connectivity.ResilienceConstraint:
      type: object
      properties:
        is-lock-out:
          type: boolean
          description: "The resource is configured to temporarily not be available for use in the protection scheme(s) it is part of.\n                    This overrides all other protection control states including forced.\n                    If the item is locked out then it cannot be used under any circumstances.\n                    Note: Only relevant when part of a protection scheme."
          default: false
        max-switch-times:
          type: integer
          format: int32
          description: Used to limit the maximum swtich times. When work fault disappears , and traffic return to the original work path, switch counter reset.
        restoration-coordinate-type:
          description: ' The coordination mechanism between multi-layers.'
          $ref: '#/components/schemas/tapi.connectivity.CoordinateType'
        is-coordinated-switching-both-ends:
          type: boolean
          description: Is operating such that switching at both ends of each flow acorss the FC is coordinated at both ingress and egress ends.
          default: false
        hold-off-time:
          type: integer
          format: int32
          description: This attribute indicates the time, in milliseconds, between declaration of signal degrade or signal fail, and the initialization of the protection switching algorithm.
        is-frozen:
          type: boolean
          description: "Temporarily prevents any switch action to be taken and, as such, freezes the current state.\n                    Until the freeze is cleared, additional near-end external commands are rejected and fault condition changes and received APS messages are ignored.\n                    All administrative controls of any aspect of protection are rejected."
          default: false
        wait-to-revert-time:
          type: integer
          format: int32
          description: If the protection system is revertive, this attribute specifies the time, in minutes, to wait after a fault clears on a higher priority (preferred) resource before reverting to the preferred resource.
          default: 15
        layer-protocol:
          description: Indicate which layer this resilience parameters package configured for.
          $ref: '#/components/schemas/tapi.common.LayerProtocolName'
        resilience-type:
          description: none
          $ref: '#/components/schemas/tapi.topology.ResilienceType'
        restore-priority:
          type: integer
          format: int32
          description: none
        reversion-mode:
          description: Indcates whether the protection scheme is revertive or non-revertive.
          $ref: '#/components/schemas/tapi.connectivity.ReversionMode'
    tapi.connectivity.SwitchControl:
      allOf:
      - $ref: '#/components/schemas/tapi.common.GlobalClass'
      - $ref: '#/components/schemas/tapi.connectivity.ResilienceConstraint'
      - type: object
        properties:
          sub-switch-control:
            type: array
            description: none
            items:
              $ref: '#/components/schemas/tapi.connectivity.SwitchControlRef'
          switch:
            type: array
            description: none
            items:
              $ref: '#/components/schemas/tapi.connectivity.Switch'
        description: Represents the capability to control and coordinate switches, to add/delete/modify FCs and to add/delete/modify LTPs/LPs so as to realize a protection scheme.
    mef.common.DscpEecIdPac:
      type: object
      properties:
        ip-version:
          description: This attribute specifies the IP version for the DSCP. It can be IPV4, IPV6 or IPV4_AND_IPV6.
          $ref: '#/components/schemas/mef.common.types.IpVersion'
        dscp-value-list:
          type: array
          description: 'This attribute is a list of DSCP values that maps to the EEC Name. '
          items:
            type: integer
            format: int64
    tapi.topology.LinkRef:
      allOf:
      - $ref: '#/components/schemas/tapi.topology.TopologyRef'
      - type: object
        properties:
          link-id:
            type: string
            x-path: /tapi-common:context/tapi-topology:topology/tapi-topology:link/tapi-topology:uuid
    tapi.connectivity.createconnectivityservice.output.service.EndPoint:
      allOf:
      - $ref: '#/components/schemas/nrp.interface.EndPointAugmentation1'
      - $ref: '#/components/schemas/tapi.connectivity.ConnectivityServiceEndPoint'
    mef.common.types.FrameColor:
      type: string
      enum:
      - GREEN
      - YELLOW
    tapi.connectivity.ConnectivityServiceRef:
      type: object
      properties:
        connectivity-service-id:
          type: string
          x-path: /tapi-common:context/tapi-connectivity:connectivity-service/tapi-connectivity:uuid
    tapi.path.computation.PathRef:
      type: object
      properties:
        path-id:
          type: string
          x-path: /tapi-common:context/tapi-path-computation:path/tapi-path-computation:uuid
    tapi.connectivity.deleteconnectivityservice.output.Service:
      allOf:
      - $ref: '#/components/schemas/nrp.interface.ServiceAugmentation1'
      - $ref: '#/components/schemas/tapi.common.AdminStatePac'
      - $ref: '#/components/schemas/tapi.common.GlobalClass'
      - $ref: '#/components/schemas/tapi.connectivity.ConnectivityConstraint'
      - $ref: '#/components/schemas/tapi.connectivity.ResilienceConstraint'
      - $ref: '#/components/schemas/tapi.connectivity.TopologyConstraint'
      - type: object
        properties:
          layer-protocol-name:
            description: none
            $ref: '#/components/schemas/tapi.common.LayerProtocolName'
          connection:
            type: array
            description: none
            items:
              type: string
              x-path: /tapi-common:context/tapi-connectivity:connection/tapi-connectivity:uuid
          end-point:
            type: array
            description: none
            items:
              $ref: '#/components/schemas/tapi.connectivity.deleteconnectivityservice.output.service.EndPoint'
          direction:
            description: none
            $ref: '#/components/schemas/tapi.common.ForwardingDirection'
        description: none
    mef.common.CosNameAndColorToDeiPac:
      type: object
      properties:
        ingress-cos-name:
          type: string
          description: This attribute denotes the ingress CoS name.
        dei-value:
          description: 'This attribute denotes the egress frame DEI value, mapped from ingress CoS Name and ingress frame color. '
          $ref: '#/components/schemas/mef.common.types.DeiOrDiscard'
        ingress-color:
          description: 'This attribute denotes the ingress frame color as one of the determined factor for Egress Map. '
          $ref: '#/components/schemas/mef.common.types.FrameColor'
    tapi.connectivity.ReversionMode:
      type: string
      enum:
      - REVERTIVE
      - NON-REVERTIVE
    tapi.topology.RestorationPolicy:
      type: string
      enum:
      - PER_DOMAIN_RESTORATION
      - END_TO_END_RESTORATION
      - NA
    mef.common.types.L2cpProtocolType:
      type: string
      enum:
      - ETHERTYPE
      - LLC
    mef.common.ColorIdentifier:
      type: object
      properties:
        dei-color-pac:
          description: This attribute represents the relationship between the ColorIdentifier and the DeiColorIdPac (representing the choice that maps Vlan tag DEI to Color).
          $ref: '#/components/schemas/mef.common.DeiColorIdPac'
        color-field-type:
          description: This attribute determines which conditional package (among EVC/OVC End Point, PCP, DEI or DSCP) to be used as the Color Identifier.
          $ref: '#/components/schemas/mef.common.types.ColorFieldType'
        sep-color-pac:
          description: This attribute represents the relationship between the ColorIdentifier and the SepColorIdPac (representing the choice that maps EVC End Point or OVC End Point to Color).
          $ref: '#/components/schemas/mef.common.SepColorIdPac'
        dcsp-color-pac:
          type: array
          description: This attribute represents the relationship between the ColorIdentifier and the DscpColorIdPac (representing the choice that maps DSCP values to Color).
          items:
            $ref: '#/components/schemas/mef.common.DscpColorIdPac'
        pcp-color-pac:
          description: This attribute represents the relationship between the ColorIdentifier and the PcpColorIdPac (representing the choice that maps Vlan tag PCPs to Color).
          $ref: '#/components/schemas/mef.common.PcpColorIdPac'
    tapi.common.OperationalStatePac:
      type: object
      properties:
        operational-state:
          description: none
          $ref: '#/components/schemas/tapi.common.OperationalState'
        lifecycle-state:
          description: none
          $ref: '#/components/schemas/tapi.common.LifecycleState'
    tapi.connectivity.SelectionControl:
      type: string
      enum:
      - LOCK_OUT
      - NORMAL
      - MANUAL
      - FORCED
    tapi.connectivity.GetConnectivityServiceDetailsInput:
      properties:
        input:
          type: object
          properties:
            service-id-or-name:
              type: string
              description: none
    nrm.connectivity.VlanIdListAndUntag:
      type: object
      properties:
        vlan-id:
          type: array
          description: This is for VLAN ID from 1 to 4094
          items:
            $ref: '#/components/schemas/mef.common.types.VlanId'
        vlan-id-mapping-type:
          description: 'Type=LIST: all listed VLAN IDs. Type=EXCEPT: all VLAN IDs except the listed ones. Type=ALL, all VLAN IDs, hence vlanId list is not applicable.'
          $ref: '#/components/schemas/mef.common.types.VlanIdMappingType'
        untagged-and-prio-tagged-included:
          type: boolean
          description: If true, then untagged and priority tagged frames are included in the mapping, otherwise not.
          default: false
    mef.common.PcpColorIdPac:
      type: object
      properties:
        pcp-value-for-yellow-list:
          type: array
          description: 'This attribute provides a list PCP values map to the yellow ingress EI frames. The pcpValueForGreenList and the pcpValueForYellowList must disjoint and the union of the two lists must include all possible PCP values. '
          items:
            type: integer
            format: int64
        pcp-value-for-green-list:
          type: array
          description: 'This attribute provides a list PCP values map to the green ingress EI frames. The pcpValueForGreenList and the pcpValueForYellowList must disjoint and the union of the two lists must include all possible PCP values. '
          items:
            type: integer
            format: int64
    tapi.connectivity.createconnectivityservice.output.Service:
      allOf:
      - $ref: '#/components/schemas/nrp.interface.ServiceAugmentation1'
      - $ref: '#/components/schemas/tapi.common.AdminStatePac'
      - $ref: '#/components/schemas/tapi.common.GlobalClass'
      - $ref: '#/components/schemas/tapi.connectivity.ConnectivityConstraint'
      - $ref: '#/components/schemas/tapi.connectivity.ResilienceConstraint'
      - $ref: '#/components/schemas/tapi.connectivity.TopologyConstraint'
      - type: object
        properties:
          layer-protocol-name:
            description: none
            $ref: '#/components/schemas/tapi.common.LayerProtocolName'
          connection:
            type: array
            description: none
            items:
              type: string
              x-path: /tapi-common:context/tapi-connectivity:connection/tapi-connectivity:uuid
          end-point:
            type: array
            description: none
            items:
              $ref: '#/components/schemas/tapi.connectivity.createconnectivityservice.output.service.EndPoint'
          direction:
            description: none
            $ref: '#/components/schemas/tapi.common.ForwardingDirection'
        description: none
    mef.common.types.ColorMode:
      type: string
      enum:
      - COLOR_AWARE
      - COLOR_BLIND
    mef.common.types.VlanIdMappingType:
      type: string
      enum:
      - ALL
      - EXCEPT
      - LIST
    tapi.connectivity.CreateConnectivityServiceInputInput:
      allOf:
      - $ref: '#/components/schemas/nrp.interface.CreateConnectivityServiceInputAugmentation1'
      - type: object
        properties:
          topo-constraint:
            description: none
            $ref: '#/components/schemas/tapi.connectivity.TopologyConstraint'
          state:
            type: string
            description: none
          end-point:
            type: array
            description: none
            items:
              $ref: '#/components/schemas/tapi.connectivity.createconnectivityservice.input.EndPoint'
          conn-constraint:
            description: none
            $ref: '#/components/schemas/tapi.connectivity.ConnectivityConstraint'
          resilience-constraint:
            type: array
            description: none
            items:
              $ref: '#/components/schemas/tapi.connectivity.ResilienceConstraint'
        description: ''
    tapi.connectivity.Connection:
      allOf:
      - $ref: '#/components/schemas/tapi.common.GlobalClass'
      - $ref: '#/components/schemas/tapi.common.OperationalStatePac'
      - type: object
        properties:
          lower-connection:
            type: array
            description: "An Connection object supports a recursive aggregation relationship such that the internal construction of an Connection can be exposed as multiple lower level Connection objects (partitioning).\n                    Aggregation is used as for the Node/Topology  to allow changes in hierarchy.\n                    Connection aggregation reflects Node/Topology aggregation.\n                    The FC represents a Cross-Connection in an NE. The Cross-Connection in an NE is not necessarily the lowest level of FC partitioning."
            items:
              type: string
              x-path: /tapi-common:context/tapi-connectivity:connection/tapi-connectivity:uuid
          switch-control:
            type: array
            description: none
            items:
              $ref: '#/components/schemas/tapi.connectivity.SwitchControl'
          route:
            type: array
            description: none
            items:
              $ref: '#/components/schemas/tapi.connectivity.Route'
          layer-protocol-name:
            description: none
            $ref: '#/components/schemas/tapi.common.LayerProtocolName'
          connection-end-point:
            type: array
            description: none
            items:
              $ref: '#/components/schemas/tapi.connectivity.ConnectionEndPointRef'
          direction:
            description: none
            $ref: '#/components/schemas/tapi.common.ForwardingDirection'
        description: "The ForwardingConstruct (FC) object class models enabled potential for forwarding between two or more LTPs and like the LTP supports any transport protocol including all circuit and packet forms.\n                At the lowest level of recursion, a FC represents a cross-connection within an NE."
    tapi.common.TimeRange:
      type: object
      properties:
        end-time:
          type: string
          description: none
        start-time:
          type: string
          description: none
    mef.common.types.ColorFieldType:
      type: string
      enum:
      - PCP
      - DEI
      - END_POINT
      - DSCP
    mef.common.SepEecIdPac:
      type: object
    mef.common.DscpCosIdPac:
      type: object
      properties:
        ip-version:
          description: This attribute denotes the IP version for the DSCP. It can be IPV4, IPV6 or IPV4_AND_IPV6.
          $ref: '#/components/schemas/mef.common.types.IpVersion'
        dscp-value-list:
          type: array
          description: This attribute is a list of DSCP values that maps to a CoS Name.
          items:
            type: integer
            format: int64
    mef.common.PcpEecIdPac:
      type: object
      properties:
        pcp-value-list:
          type: array
          description: This attribute provides a list of PCP values that map to the Egress Equivalence Class Name.
          items:
            type: integer
            format: int64
    tapi.topology.OwnedNodeEdgePointRef:
      allOf:
      - $ref: '#/components/schemas/tapi.topology.NodeRef'
      - type: object
        properties:
          owned-node-edge-point-id:
            type: string
            x-path: /tapi-common:context/tapi-topology:topology/tapi-topology:node/tapi-topology:owned-node-edge-point/tapi-topology:uuid
    tapi.connectivity.RouteObjectiveFunction:
      type: string
      enum:
      - MIN_WORK_ROUTE_HOP
      - MIN_WORK_ROUTE_COST
      - MIN_WORK_ROUTE_LATENCY
      - MIN_SUM_OF_WORK_AND_PROTECTION_ROUTE_HOP
      - MIN_SUM_OF_WORK_AND_PROTECTION_ROUTE_COST
      - MIN_SUM_OF_WORK_AND_PROTECTION_ROUTE_LATENCY
      - LOAD_BALANCE_MAX_UNUSED_CAPACITY
    tapi.connectivity.getconnectivityservicedetails.output.Service:
      allOf:
      - $ref: '#/components/schemas/nrp.interface.ServiceAugmentation1'
      - $ref: '#/components/schemas/tapi.common.AdminStatePac'
