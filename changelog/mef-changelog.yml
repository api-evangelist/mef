current:
  release: kylie
  date: '2026-02-17'
  headline: Ninth LSO API release. MCP Server code added for every Seller-side API; Circuit Impairment
    and Maintenance Notification API (Mplify 175) published; Address (121.1), Site (122.1), POQ (87.1),
    Quote (115.1), Inventory (116.1), Ordering (123.1), Trouble Ticket (124.1), Appointment/Work Order
    (137.1), Billing (141.1) and Product Catalog (142) Developer Guides published as standards; first
    release under the Mplify Alliance name (MEF Forum rebranded 24 June 2025) with already-published standards
    keeping the MEF name.
