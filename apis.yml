aid: mef
url: https://raw.githubusercontent.com/api-evangelist/mef/refs/heads/main/apis.yml
name: MEF
kind: company
description: 'MEF — rebranded as Mplify Alliance on 24 June 2025 — is a US-headquartered nonprofit industry
  alliance of network, cloud, cybersecurity and enterprise organizations that defines the standards behind
  Carrier Ethernet, SD-WAN, SASE and Network-as-a-Service, and that publishes the LSO (Lifecycle Service
  Orchestration) API suite used by carriers to automate wholesale and inter-provider business and operational
  transactions. MEF sits on the wireline/standards side of the telecom value chain: it does not operate
  a network and sells no connectivity, it produces specifications, SDKs, an interop test service and the
  MEF 3.0 LSO API Certification Program that service providers and their software vendors implement. Its
  API posture is unusually open for this sector — the LSO Cantata, Sonata, Allegro, Interlude, Legato
  and Presto SDKs are published as Apache-2.0 OpenAPI documents in the public MEF-GIT GitHub organization,
  and lso.mplify.net is a genuine, no-login developer portal with an API catalog, payload catalog, an
  API blending tool and SDK release downloads. The membership wall sits one layer in, not around the specs:
  the per-API Developer Guides on GitHub and the test-requirements documents on the Mplify wiki are member-only,
  while the machine-readable API definitions themselves are free to anyone. On network APIs MEF is a GSMA
  Open Gateway MOU signatory (announced 11 November 2025, alongside the GSMA, the Linux Foundation and
  TM Forum) and ships a pre-standard LSO Quality on Demand payload schema explicitly aligned to the CAMARA
  QoD API — it complements CAMARA on the wireline side rather than exposing CAMARA endpoints itself, because
  it has no network to expose.'
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
