camara:
  posture: >-
    Standards-body partner, not a CAMARA implementer — MEF has no network to expose. MEF is
    a signatory to the GSMA Open Gateway Memorandum of Understanding (announced 11 November
    2025, alongside the GSMA, the Linux Foundation and TM Forum) and contributes its wireline
    LSO APIs to complement CAMARA's mobile network APIs. The one concrete, machine-readable
    CAMARA artifact is the pre-standard LSO Quality on Demand payload schema shipped in the
    Sonata and Cantata SDKs, whose JSON Schema is modelled directly on the CAMARA QoD session
    object and cites CAMARA Commonalities v0.4 by name in its own comments. This is real
    alignment on one API, not a press release — but MEF exposes no callable CAMARA endpoint.
  apis:
    - name: Quality on Demand (QoD)
      evidence: >-
        schema/productSchema/preStandard/qualityOnDemand/qosSession.yaml in MEF-LSO-Sonata-SDK
        and MEF-LSO-Cantata-SDK at tag kylie (HTTP 200). Title "MEF LSO - QoS Session",
        $id urn:mef:xid:spec:product:qos-session:v0.0.1:all. Contains device/applicationServer/
        devicePorts/qosProfile modelled on the CAMARA QoD createSession object and states
        "for the Commonalities release v0.4, we are enforcing that the networkAccessIdentifier
        is only part of the schema for future-proofing, and CAMARA does not currently allow
        its use."
      status: pre-standard payload schema, member-blendable via the LSO API Blender; not a
        callable MEF-operated endpoint
      portalReference: >-
        https://lso.mplify.net/network-apis states "The CAMARA QoD API aims to provide the
        customer with the ability to set the quality for a flow within an access network
        connection ... The five pre-standard LSO QoD APIs can be accessed via the LSO
        Blending Tool."
  notFound:
    - Number Verification
    - SIM Swap
    - Device Location / Location Verification
    - Device Status / Reachability
    - Carrier Billing
    - KYC Match
    - Anti-fraud / Scam Signal
    - Device Swap
    - Population Density
  openGatewayMember: true
  openGatewayNature: >-
    MOU signatory / ecosystem partner as a standards body — NOT one of the 80+ mobile
    operator groups that commit to exposing CAMARA APIs. Recorded at
    https://www.gsma.com/solutions-and-impact/gsma-open-gateway/mplify-joins-gsma-open-gateway-framework-to-advance-unified-network-apis-across-wired-and-wireless-domains-for-ai-powered-connectivity/
    and https://www.mplify.net/news/mplify-joins-gsma-open-gateway-framework-to-advance-unified-network-apis-across-wired-and-wireless-domains-for-ai-powered-connectivity/
  aduna: no evidence of any Aduna relationship found
tmForum:
  relationship: >-
    Peer standards body and upstream source, not a certification holder. MEF does not hold
    TM Forum Open API conformance certification — it is an SDO, not an implementer. What it
    does do is BUILD ON TM Forum Open APIs and say so in the specs: the harvested definitions
    carry attribution such as "TMF API Reference : TMF 633/638/641 v18.5.1" and "This file
    includes content based on the TM Forum Service Catalog Management API (TMF633 v3.0.0)
    available at https://github.com/tmforum-apis/TMF633_ServiceCatalog, which is licensed by
    the TM Forum under the Apache License 2.0."
  referencedTMFApis:
    - TMF633 Service Catalog Management
    - TMF638 Service Inventory Management
    - TMF641 Service Ordering Management
  mefCertification: >-
    MEF runs its own certification instead — the MEF 3.0 LSO API Certification Program
    (https://www.mplify.net/certification/testing-certifications-for-lso-apis/lso-api-certification/,
    200) plus the LSO API Onboarding & Interop Test (OIT) Service
    (https://www.mplify.net/certification/testing-certifications-for-lso-apis/lso-api-test-service/,
    200), delivered with certification partner Amartus. Certified units are a triple of
    Seller + Business Function + LSO API Release.
  alsoJointMOU: TM Forum is a co-signatory with MEF on the GSMA Open Gateway MOU.
threeGpp:
  nefScefSurface: false
  note: >-
    No NEF or SCEF surface — MEF's equivalent southbound interface is LSO Presto (MEF 60
    Network Resource Provisioning), a RESTCONF-style Swagger 2.0 definition derived from the
    ONF Transport API model, base path /restconf, 32 paths. No 5G network-slicing or MEC API
    was found published by MEF. Edge compute appears only as a pre-standard payload schema
    directory in the Sonata/Cantata SDKs.
auth:
  model: OAuth 2.0 client credentials (machine-to-machine)
  evidence: >-
    The canonical productApi/ and serviceApi/ definitions ship with NO securitySchemes at all
    (0 of 95 harvested documents declare one) — they are contract definitions for implementers
    to secure. The `generated/security/*` variants in each SDK add a single scheme,
    `oauth2MEFLSOAPI`, type oauth2, flow clientCredentials, scope `default`, with placeholder
    tokenUrl http://mef.net/example/token. Confirmed at
    https://raw.githubusercontent.com/MEF-GIT/MEF-LSO-Sonata-SDK/kylie/generated/security/order/productOrderManagement.api.yaml
    (HTTP 200).
  ciba: false
  cibaNote: >-
    CIBA (Client-Initiated Backchannel Authentication) does NOT appear anywhere in MEF's
    published API surface. MEF's LSO APIs are provider-to-provider and provider-to-enterprise
    B2B contracts secured by two-legged OAuth, not subscriber-consent network authorization.
    That is the structural difference between MEF's wireline API model and CAMARA's.
  oidcDiscovery: not served — https://lso.mplify.net/.well-known/openid-configuration returns 404
  apiKeys: none documented
  mtls: not documented in the published specs
webhooks:
  present: true
  mechanism: >-
    Hub/listener callback pattern inherited from TM Forum Open APIs. Every LSO functional area
    ships a paired "Notification" OpenAPI alongside its "Management" OpenAPI — 39 of the 94
    harvested OpenAPI documents are notification/listener definitions (billingNotification,
    productOrderNotification, quoteNotification, alarmNotification, faultNotification,
    serviceInventoryNotification, and so on). Subscribers POST to /hub to register a callback
    and the Seller POSTs events to the registered listener.
  asyncapi:
    present: true
    file: asyncapi/mef-lso-interlude-performance.template-asyncapi.yml
    source: https://raw.githubusercontent.com/MEF-GIT/MEF-LSO-Interlude-SDK/kylie/serviceApi/pm/streaming/performance.template.asyncapi.yaml
    note: >-
      AsyncAPI 2.0.0 template for streaming performance-monitoring data. An identical template
      also ships in the Legato and Allegro SDKs; harvested once. A companion
      streamingManagement OpenAPI manages topics and subscriptions.
sdks:
  firstPartyPackages: none
  npm: none found
  pypi: none found
  maven: none found
  nuget: none found
  note: >-
    "SDK" in MEF's vocabulary means a versioned bundle of specification documents, not client
    libraries. SDK releases are GitHub release zips (Mplify-LSO-Sonata-SDK-kylie.zip and
    siblings, linked from https://lso.mplify.net/lso-api-sdk-releases). Releases are named
    after singers: aretha, billie, celine, dolly, ella, fergie, grace, haley, irene, janis,
    kylie — kylie is current, published 2026-02-17.
mcp:
  present: true
  note: >-
    Genuinely notable for a standards body. The kylie release notes say "MCP Server code added
    for every Seller side API." Each SDK ships generated/mcp/ containing a Python Model Context
    Protocol server (`mplify-mcp-runner`, src/mcp_openapi_server/, Dockerfile, pyproject.toml),
    per-API .env files, MPLIFY-MCP-QUICKSTART.md, and MCP-flavored copies of each API
    definition. MEF publishes an agent-facing runner for its own standard; it does not host one.
postman:
  present: true
  note: >-
    Postman collections ship inside the SDK repos as documentation appendices, not as a public
    Postman workspace. Examples: "MEF 106 - Appendix A.postman_collection.json",
    "MEF 125.0.1 Appendix A.postman_collection.json", "Mplify 139.1 Appendix A.postman_collection.json"
    (Sonata/Cantata) and "MEF 99_1_with_MEF 101 Service Ordering Management.postman_collection.json",
    "MEF W103 Service Order Management API.postman_collection.json" (Interlude/Legato/Allegro).
  publicWorkspace: none found
graphql:
  present: false
grpc:
  present: false
  note: no .proto files published in the public MEF-GIT repos
gated:
  overall: false
  detail: >-
    The specs are not gated. Two adjacent things are: per-API Developer Guide PDFs are
    described on the portal as "only available to MEF members on GitHub", and MEF W92.1 LSO
    test requirements as "only available to MEF members on the wiki" (wiki.mplify.net, 200,
    content behind Confluence login). Membership sign-up at https://www.mplify.net/join-mplify/.
    Note one inconsistency worth flagging: at least one Developer Guide PDF linked from the
    catalog resolved 200 anonymously from the public releases endpoint.
transports:
  - protocol: REST
    scheme: https
    documented: true
    note: >-
      All 94 harvested OpenAPI documents are HTTPS REST/JSON. Server URLs are templated,
      e.g. https://{serverBase}/mefApi/sonata/productOrderingManagement/v11/ — MEF defines the
      path contract, the implementing Seller supplies the host.
  - protocol: Webhook / HTTP callback
    scheme: https
    documented: true
    note: TM Forum-style hub/listener registration; 38 notification OpenAPI documents.
  - protocol: Streaming (AsyncAPI 2.0.0)
    scheme: https
    documented: true
    note: performance-monitoring streaming template in Interlude/Legato/Allegro.
  - protocol: RESTCONF
    scheme: https
    documented: true
    note: LSO Presto MEF 60 Network Resource Provisioning, Swagger 2.0, basePath /restconf.
  - protocol: GraphQL
    documented: false
  - protocol: gRPC
    documented: false
  - protocol: WebSocket
    documented: false
