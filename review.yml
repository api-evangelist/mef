aid: mef
name: MEF
review:
  question: >-
    Does MEF (Mplify Alliance) publish a real, self-serve developer surface with downloadable
    machine-readable API definitions, and what is its CAMARA / GSMA Open Gateway posture?
  answer: true
  date: '2026-07-25'
  reviewer: API Evangelist
  tier: standards-body
  homeMarket: United States
findings:
  summary: |
    MEF is a standards body, not an operator, and it is one of the more genuinely open
    API publishers in telecom. MEF Forum rebranded to Mplify Alliance on 24 June 2025;
    mef.net now 301s to mplify.net, and already-published standards keep the "MEF" name.

    There is a REAL, self-serve developer portal at https://lso.mplify.net/ (HTTP 200,
    no login wall, no registration). It carries an LSO API Catalog, an LSO Payload
    Catalog, SDK release downloads, a Network APIs page, an LSO API Blending Tool that
    produces a downloadable zip of blended API + payload, and evaluate/implement guides.
    Nothing on the portal required credentials during this review.

    The machine-readable specifications themselves are openly downloadable from the
    public GitHub organization https://github.com/MEF-GIT under Apache-2.0. Ninety-five
    real specification documents were harvested verbatim from the latest published
    release tag (`kylie`) across six LSO Interface Reference Point SDKs.

    The membership wall exists, but it sits one layer INSIDE the specs rather than
    around them. The LSO API catalog pages state plainly: "API developer guides are only
    available to MEF members on GitHub" and "LSO API test requirements are only
    available to MEF members on the wiki." So: the OpenAPI is free, the prose developer
    guide PDFs and the MEF W92.1 test requirements are member-only. wiki.mplify.net and
    members.mplify.net both resolve but gate their content. That gap — public contract,
    private implementation guidance — is the honest characterization of this organization.
  developerPortal:
    url: https://lso.mplify.net/
    httpStatus: 200
    verdict: real self-serve developer portal
    loginRequired: false
    notes: >-
      Drupal-based "Mplify Alliance Developer Portal". API catalog, payload catalog, SDK
      releases, tools, network APIs, support. Also reachable at https://lso.mef.net/ (200).
      No /openapi.json, /swagger.json, /api-docs, /spec or /sitemap.xml served (all 404) —
      the specs live on GitHub, not on the portal host.
